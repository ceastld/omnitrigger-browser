[package]
name = "omnitrigger-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "本地到 Chrome 扩展的通用 API 桥接"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "omnitrigger-browser"
path = "src/main.rs"

[[bin]]
name = "omnitrigger-browser-host"
path = "src/host.rs"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

